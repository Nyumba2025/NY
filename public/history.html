<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico — Nyumba Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; margin: 0; padding: 30px; }
        .history-wrap { max-width: 900px; margin: 0 auto; }
        h1 { color: #2c3e50; margin-bottom: 8px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; }
        .commit-list { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.07); overflow: hidden; }
        .commit { display: flex; align-items: flex-start; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #f0f0f0; }
        .commit:last-child { border-bottom: none; }
        .commit-icon { width: 36px; height: 36px; border-radius: 50%; background: #3498db22; display: flex; align-items: center; justify-content: center; color: #3498db; font-size: 1rem; flex-shrink: 0; margin-top: 2px; }
        .commit-info { flex: 1; }
        .commit-msg { font-weight: 600; color: #2c3e50; margin: 0 0 4px; }
        .commit-meta { font-size: 0.85rem; color: #7f8c8d; }
        .commit-hash { font-family: monospace; background: #f0f0f0; padding: 2px 7px; border-radius: 4px; font-size: 0.8rem; color: #555; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; text-decoration: none; color: #3498db; font-weight: 600; }
        .back-btn:hover { text-decoration: underline; }
        #loading { text-align: center; padding: 50px; color: #7f8c8d; }
        #error-msg { text-align: center; padding: 40px; color: #e74c3c; }
    </style>
</head>
<body>
<div class="history-wrap">
    <a href="/admin" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar ao painel</a>
    <h1><i class="fas fa-history"></i> Histórico de Commits</h1>
    <p class="subtitle">Registo de alterações no repositório</p>
    <div class="commit-list" id="commit-list">
        <div id="loading"><i class="fas fa-spinner fa-spin"></i> A carregar histórico...</div>
    </div>
</div>
<script>
    fetch('/api/admin/history?limit=50', { credentials: 'include' })
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('commit-list');
            if (!data.success || !data.commits || data.commits.length === 0) {
                list.innerHTML = '<div id="error-msg"><i class="fas fa-info-circle"></i><br>Sem commits para mostrar.<br><small>O repositório Git pode não estar configurado.</small></div>';
                return;
            }
            list.innerHTML = data.commits.map(c => `
                <div class="commit">
                    <div class="commit-icon"><i class="fas fa-code-commit"></i></div>
                    <div class="commit-info">
                        <p class="commit-msg">${escHtml(c.message || c.msg || '(sem mensagem)')}</p>
                        <span class="commit-meta">
                            <i class="fas fa-user"></i> ${escHtml(c.author_name || c.author || 'Desconhecido')} &nbsp;·&nbsp;
                            <i class="fas fa-calendar"></i> ${formatDate(c.date || c.timestamp)} &nbsp;·&nbsp;
                            <span class="commit-hash">${(c.hash || c.id || '').substring(0, 7)}</span>
                        </span>
                    </div>
                </div>`).join('');
        })
        .catch(() => {
            document.getElementById('commit-list').innerHTML =
                '<div id="error-msg"><i class="fas fa-exclamation-triangle"></i><br>Não foi possível carregar o histórico.</div>';
        });

    function escHtml(str) {
        return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }
    function formatDate(d) {
        if (!d) return '—';
        return new Date(d).toLocaleString('pt-PT', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }
</script>
</body>
</html>
